plugins {
    id 'java'
}

group = 'com.example'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

ext {
    bootBomVersion = findProperty('bootVersion') ?: '3.5.16'
    ociJavaSdkVersion = findProperty('ociSdkVersion') ?: '3.92.0'
}

dependencies {
    implementation platform("org.springframework.boot:spring-boot-dependencies:${bootBomVersion}")
    annotationProcessor platform("org.springframework.boot:spring-boot-dependencies:${bootBomVersion}")
    testImplementation platform("org.springframework.boot:spring-boot-dependencies:${bootBomVersion}")
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.3.0'
    implementation "com.oracle.oci.sdk:oci-java-sdk-redis:${ociJavaSdkVersion}"
    implementation "com.oracle.oci.sdk:oci-java-sdk-common-httpclient-jersey3:${ociJavaSdkVersion}"
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
